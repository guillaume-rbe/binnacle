<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>This setup: how the dash connects with Binnacle</title>
  <desc>With Binnacle: car data still only flows from the Tesla CAN bus through the MCUs and the stock CAN app to Binnacle, which reads it. The forward camera shows inside Binnacle. Android's own Bluetooth, turned on with root, carries music, calls, track names, controls and contacts to the Tesla through a manual root-only overlay; the BT1036 and Goodocom modules stand by. Binnacle's CarPlay app (built from xcertplay) uses Android Bluetooth, the Wi-Fi radio and the MFi chip, starts only when asked, and draws CarPlay inside Binnacle. With root, Binnacle keeps ADB off the Wi-Fi.</desc>

  <style>
    .bg { fill: #e6ebf1; }
    .title { fill: #0d1520; font-size: 22px; font-weight: 700; }
    .sub { fill: #5a6676; font-size: 13px; }
    .col { fill: #5a6676; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .h { fill: #0d1520; font-size: 14px; font-weight: 600; }
    .t { fill: #5a6676; font-size: 11.5px; }
    .lbl { fill: #0d1520; font-size: 11px; }
    .lbl-red { fill: #c4281f; font-size: 11px; font-weight: 700; }
    .encl { fill: #f5f7fa; stroke: #c9d2dd; stroke-width: 1.5; }
    .car { fill: #fdeceb; stroke: #e5392f; stroke-width: 1.5; }
    .hw { fill: #e3f2fb; stroke: #0a8fd8; stroke-width: 1.5; }
    .sw { fill: #e2f5ee; stroke: #12a46e; stroke-width: 1.5; }
    .main { fill: #12a46e; stroke: #0e8a5c; stroke-width: 1.5; }
    .main-h { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .main-t { fill: #e2f5ee; font-size: 11.5px; }
    .ext { fill: #ffffff; stroke: #b3bcc7; stroke-width: 1.5; }
    .off { fill: #f5f7fa; stroke: #b3bcc7; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .root { fill: #e08a00; }
    .root-t { fill: #ffffff; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
    .ln { stroke: #5a6676; stroke-width: 2; fill: none; }
    .ln-red { stroke: #e5392f; stroke-width: 2.5; fill: none; }
    .ln-off { stroke: #b3bcc7; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .ln-mcu { stroke: #5a6676; stroke-width: 1.5; fill: none; stroke-dasharray: 2 3; }
    .ah { fill: #5a6676; }
    .ah-red { fill: #e5392f; }
    .ah-off { fill: #b3bcc7; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #07090d; }
      .title, .h, .lbl { fill: #eef3f8; }
      .sub, .t, .col { fill: #8793a4; }
      .lbl-red { fill: #ff5a52; }
      .encl { fill: #0e131b; stroke: #222c39; }
      .car { fill: #2a1214; stroke: #ff5a52; }
      .hw { fill: #0b2233; stroke: #36b9ff; }
      .sw { fill: #0c241c; stroke: #37e0a0; }
      .main { fill: #12805a; stroke: #37e0a0; }
      .main-t { fill: #d6f7ea; }
      .ext { fill: #141b25; stroke: #505b6a; }
      .off { fill: #0e131b; stroke: #505b6a; }
      .root { fill: #ffb84d; }
      .root-t { fill: #07090d; }
      .ln { stroke: #8793a4; }
      .ln-red { stroke: #ff5a52; }
      .ln-off { stroke: #505b6a; }
      .ln-mcu { stroke: #8793a4; }
      .ah { fill: #8793a4; }
      .ah-red { fill: #ff5a52; }
      .ah-off { fill: #505b6a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-red"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-off"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="800"/>
  <text class="title" x="20" y="36">This setup: how the dash connects with Binnacle</text>
  <text class="sub" x="20" y="58">The owner's unit today. Orange marks the parts that need root once (su or adb root); see the README's Root section.</text>
  <text class="col" x="20" y="96">THE CAR</text>
  <text class="col" x="280" y="96">INSIDE THE DASH: CHIPS</text>
  <text class="col" x="540" y="96">INSIDE THE DASH: APPS</text>
  <text class="col" x="800" y="96">YOUR PHONE &amp; HOME</text>
  <rect class="encl" x="262" y="106" width="496" height="624" rx="14"/>
  <rect class="car" x="20" y="124" width="190" height="62" rx="8"/>
  <text class="h" x="34" y="148">Tesla CAN bus</text>
  <text class="t" x="34" y="167">The car's own data network</text>
  <rect class="car" x="20" y="206" width="190" height="62" rx="8"/>
  <text class="h" x="34" y="230">Forward camera</text>
  <text class="t" x="34" y="249">Supplied analogue camera</text>
  <rect class="car" x="20" y="288" width="190" height="242" rx="8"/>
  <text class="h" x="34" y="312">Tesla's Bluetooth</text>
  <text class="t" x="34" y="331">Music, calls with the car's</text>
  <text class="t" x="34" y="346">own mic, track names, skip</text>
  <text class="t" x="34" y="361">and answer buttons, and</text>
  <text class="t" x="34" y="376">contacts.</text>
  <text class="t" x="34" y="397">Connects to Android</text>
  <text class="t" x="34" y="412">Bluetooth now. The BT1036</text>
  <text class="t" x="34" y="427">is still paired as a</text>
  <text class="t" x="34" y="442">fallback.</text>
  <text class="t" x="34" y="463">Calls, contacts and controls</text>
  <text class="t" x="34" y="478">need the manual Bluetooth</text>
  <text class="t" x="34" y="493">overlay on the dash:</text>
  <rect class="hw" x="280" y="124" width="200" height="62" rx="8"/>
  <text class="h" x="294" y="148">Car data chips</text>
  <text class="t" x="294" y="167">Two MCUs: turn car messages</text>
  <text class="t" x="294" y="182">into readings, handle sleep</text>
  <rect class="hw" x="280" y="206" width="200" height="62" rx="8"/>
  <text class="h" x="294" y="230">Camera input</text>
  <text class="t" x="294" y="249">TP9950: turns the camera</text>
  <text class="t" x="294" y="264">signal into a picture</text>
  <rect class="off" x="280" y="288" width="200" height="62" rx="8"/>
  <text class="h" x="294" y="312">Old Tesla Bluetooth</text>
  <text class="t" x="294" y="331">BT1036: still paired to</text>
  <text class="t" x="294" y="346">the Tesla as a fallback</text>
  <rect class="off" x="280" y="370" width="200" height="62" rx="8"/>
  <text class="h" x="294" y="394">Old phone Bluetooth</text>
  <text class="t" x="294" y="413">Goodocom: still there,</text>
  <text class="t" x="294" y="428">not used</text>
  <rect class="hw" x="280" y="452" width="200" height="78" rx="8"/>
  <text class="h" x="294" y="476">Android Bluetooth</text>
  <text class="t" x="294" y="495">To the Tesla: music, calls,</text>
  <text class="t" x="294" y="510">contacts. To the iPhone:</text>
  <text class="t" x="294" y="525">starting CarPlay</text>
  <rect class="root" x="434" y="462" width="36" height="17" rx="8.5"/>
  <text class="root-t" x="452.0" y="474.5" text-anchor="middle">ROOT</text>
  <rect class="hw" x="280" y="552" width="200" height="62" rx="8"/>
  <text class="h" x="294" y="576">Wi-Fi</text>
  <text class="t" x="294" y="595">Home Wi-Fi or CarPlay, one</text>
  <text class="t" x="294" y="610">at a time. ADB kept off it</text>
  <rect class="root" x="434" y="562" width="36" height="17" rx="8.5"/>
  <text class="root-t" x="452.0" y="574.5" text-anchor="middle">ROOT</text>
  <rect class="hw" x="280" y="634" width="200" height="62" rx="8"/>
  <text class="h" x="294" y="658">CarPlay security chip</text>
  <text class="t" x="294" y="677">Apple MFi: proves to the</text>
  <text class="t" x="294" y="692">iPhone this is a CarPlay unit</text>
  <rect class="sw" x="540" y="124" width="200" height="62" rx="8"/>
  <text class="h" x="554" y="148">Stock car services</text>
  <text class="t" x="554" y="167">CAN app and car service share</text>
  <text class="t" x="554" y="182">the car data with other apps</text>
  <rect class="main" x="540" y="206" width="200" height="170" rx="10"/>
  <text class="main-h" x="554" y="230">Binnacle</text>
  <text class="main-t" x="554" y="249">The dash you see: speed, gear,</text>
  <text class="main-t" x="554" y="264">battery, tyres, doors, sensors,</text>
  <text class="main-t" x="554" y="279">camera, and CarPlay in the</text>
  <text class="main-t" x="554" y="294">centre or full screen.</text>
  <text class="main-t" x="554" y="315">Reads car data only. Keeps</text>
  <text class="main-t" x="554" y="330">music at full volume through</text>
  <text class="main-t" x="554" y="345">the car service.</text>
  <rect class="sw" x="540" y="452" width="200" height="244" rx="8"/>
  <text class="h" x="554" y="476">Binnacle's CarPlay</text>
  <text class="t" x="554" y="495">Built from xcertplay. Starts</text>
  <text class="t" x="554" y="510">only when you tap CarPlay</text>
  <text class="t" x="554" y="525">(or auto-connect is on).</text>
  <text class="t" x="554" y="546">Uses Android Bluetooth to</text>
  <text class="t" x="554" y="561">set up, Wi-Fi Direct for</text>
  <text class="t" x="554" y="576">screen and sound, and the</text>
  <text class="t" x="554" y="591">MFi chip to authenticate.</text>
  <text class="t" x="554" y="612">Calls go through the iPhone</text>
  <text class="t" x="554" y="627">and the Tesla. Tells the</text>
  <text class="t" x="554" y="642">CAN app about calls, as</text>
  <text class="t" x="554" y="657">ZLink did.</text>
  <rect class="root" x="694" y="462" width="36" height="17" rx="8.5"/>
  <text class="root-t" x="712.0" y="474.5" text-anchor="middle">ROOT</text>
  <rect class="ext" x="800" y="452" width="180" height="110" rx="8"/>
  <text class="h" x="814" y="476">iPhone</text>
  <text class="t" x="814" y="495">Wireless CarPlay.</text>
  <text class="t" x="814" y="510">Bluetooth to pair, then</text>
  <text class="t" x="814" y="525">Wi-Fi Direct for the</text>
  <text class="t" x="814" y="540">screen, touch and sound</text>
  <rect class="ext" x="800" y="634" width="180" height="62" rx="8"/>
  <text class="h" x="814" y="658">Home Wi-Fi</text>
  <text class="t" x="814" y="677">Internet and updates</text>
  <path class="ln-red" d="M210,155 L276,155" marker-end="url(#ar)"/>
  <text class="lbl-red" x="214" y="146">reads</text>
  <path class="ln" d="M480,150 L536,150" marker-end="url(#a)"/>
  <text class="lbl" x="489" y="142">serial</text>
  <path class="ln-mcu" d="M540,170 L484,170" marker-end="url(#a)"/>
  <text class="lbl" x="532" y="200" text-anchor="end">volume, call mode</text>
  <path class="ln" d="M210,237 L276,237" marker-end="url(#a)"/>
  <text class="lbl" x="220" y="228">video</text>
  <path class="ln" d="M480,237 L536,237" marker-end="url(#a)"/>
  <text class="lbl" x="489" y="228">picture</text>
  <path class="ln" d="M640,186 L640,202" marker-end="url(#a)"/>
  <text class="lbl" x="648" y="199">subscribes</text>
  <path class="ln-off" d="M280,319 L214,319" marker-end="url(#ao)"/>
  <text class="lbl" x="220" y="310">fallback</text>
  <path class="ln" d="M280,491 L214,491" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="222" y="470">music,</text>
  <text class="lbl" x="222" y="483">calls</text>
  <rect class="root" x="35" y="506" width="99" height="17" rx="8.5"/>
  <text class="root-t" x="84.5" y="518.5" text-anchor="middle">ROOT · MANUAL</text>
  <path class="ln" d="M640,376 L640,448" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="648" y="405">starts it;</text>
  <text class="lbl" x="648" y="418">CarPlay shows</text>
  <text class="lbl" x="648" y="431">in Binnacle</text>
  <path class="ln" d="M480,491 L536,491" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M480,583 L536,583" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M480,665 L536,665" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M740,507 L796,507" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M480,600 L500,600 L500,708 L770,708 L770,665 L796,665" marker-end="url(#a)"/>
  <text class="lbl" x="560" y="722">when CarPlay is off</text>
  <path class="ln-red" d="M20,760 L54,760" marker-end="url(#ar)"/>
  <text class="lbl" x="64" y="764">Car data: read only, nothing goes back</text>
  <path class="ln" d="M290,760 L324,760" marker-end="url(#a)"/>
  <text class="lbl" x="334" y="764">In use</text>
  <path class="ln-off" d="M400,760 L434,760" marker-end="url(#ao)"/>
  <text class="lbl" x="444" y="764">Not used</text>
  <path class="ln-mcu" d="M520,760 L554,760" marker-end="url(#a)"/>
  <text class="lbl" x="564" y="764">To the dash's own MCU, as the stock apps do</text>
  <text class="t" x="20" y="788">The stock dash, ZLink and both stock Bluetooth modules stay installed as fallbacks. Nothing is ever sent onto the CAN bus.</text>
</svg>
