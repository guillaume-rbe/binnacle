org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Binnacle is plain Java: no Kotlin standard library in the APK (AGP 9 adds it by default).
android.builtInKotlin=false
# Keep resource file names as they are (res/drawable/ic_tab_car.xml, not res/1B.xml), as build.sh does.
android.enableResourceOptimizations=false
