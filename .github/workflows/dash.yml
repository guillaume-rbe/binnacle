# Checks the dash (app/) and the drive logger (capture/) on every pull request and push to main that
# touches them: the read-only source guards, the guard bypass tests (each compiles a planted copy and
# runs both guards, source and compiled code) and the plain-JVM unit tests. No secrets and no signing:
# release builds are signed on the owner's machine by release.sh.
name: Dash guards

on:
  pull_request:
    paths:
      - "app/**"
      - "capture/**"
      - "buildSrc/**"
      - ".github/workflows/dash.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "capture/**"
      - "buildSrc/**"
      - ".github/workflows/dash.yml"

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Source guards
        run: app/tools/check_readonly.sh && capture/tools/check_readonly.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-37.0
            build-tools;36.0.0

      - name: Guard bypass tests
        run: app/tools/test_guards.sh

      - name: Unit tests
        run: app/tests/run.sh
