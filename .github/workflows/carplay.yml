# Builds and tests the CarPlay app (carplay/) on every pull request and push to main that touches
# it: the CarPlay guard and its bypass tests, the unit tests, and an unsigned release build checked
# by the guard. No secrets and no signing: release builds are signed on the owner's machine by
# release.sh.
name: CarPlay app

on:
  pull_request:
    paths:
      - "carplay/**"
      - ".github/workflows/carplay.yml"
  push:
    branches: [main]
    paths:
      - "carplay/**"
      - ".github/workflows/carplay.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: carplay
    steps:
      - uses: actions/checkout@v4

      - name: CarPlay guard and its bypass tests
        run: guard/check_carplay.sh && guard/test_carplay_guard.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and an unsigned release build
        run: ./gradlew -Pxcertplay.unsigned=true :shared:testDebugUnitTest :mobile:assembleRelease --stacktrace

      - name: Guard on the built APK
        run: guard/check_carplay.sh --apk mobile/build/outputs/apk/release/mobile-release-unsigned.apk
